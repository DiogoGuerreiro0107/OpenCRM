packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  esbuild: true
  prisma: true
# Correções de segurança em dependências transitivas (ver docs/plano-endurecimento.md, pacote A).
# Cada entrada força a versão mínima corrigida; rever quando as dependências diretas as atualizarem.
overrides:
  multer: ">=2.5.0 <3"
  lodash: ">=4.17.24 <5"
  ip-address: ">=10.3.1 <11"
  proxy-addr: ">=2.0.8 <3"
  follow-redirects: ">=1.16.2 <2"
  body-parser: ">=1.20.9 <2"
  qs: ">=6.16.1 <7"
